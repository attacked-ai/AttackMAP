# ─────────────────────────────────────────────────────────────────────────────
# Supabase LOCAL stack for Attacked.ai (Docker containers, managed by the
# Supabase CLI).
#
# Purpose: develop and test against a copy of the database on this computer, so
# the live project (ovenyjguhkgiceddzwna) is never touched, never pays egress,
# and a Supabase outage or quota block does not stop work. Nothing in this file
# changes the live project: `supabase start` only creates containers locally.
#
#   npm run local:doctor     check Docker, disk, ports
#   npm run local:start      start the stack and write .env.docker
#   npm run dev:docker       the web app against the local stack (vite --mode docker)
#   npm run local:dump       copy the live schema (+ data) in, once (needs the DB password)
#   npm run local:reset      rebuild the local DB from supabase/migrations + seed
#   npm run local:stop       stop (data kept);  npm run local:stop -- --wipe  deletes it
#
# Runbook: LOCAL_DOCKER_SETUP.md. Heavy services are OFF (this PC has 8 GB RAM):
# realtime, analytics (logflare + vector), storage image transforms.
# ─────────────────────────────────────────────────────────────────────────────
project_id = "attackedmap"

[api]
enabled = true
port = 54321
# Same as live: the app reads only `public` (views over sweep, identity, cms, …
# live in public). graphql_public is the CLI default.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Live uses PostgREST's default 1000 too; GlobalAttackMap.jsx paginates with the
# Range header. Keep it so local behaves like live.
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Live project and the GCP migration target are both PostgreSQL 17.
major_version = 17
orioledb_version = ""

[db.pooler]
# Off. Note: the embedded Postgres under D:/attacked-dev (api pytest) also uses 54329.
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# seed.sql          = small committed, local-only fixtures (storage policies).
# seed_live_acl.sql = live's anon/authenticated grants on public objects, written by
#                     `npm run local:dump`; without it the local image's default
#                     privileges leave public objects MORE open than live.
# seed/*.sql        = the live data copy written by `npm run local:dump` (git-ignored).
enabled = true
sql_paths = ["./seed.sql", "./seed_live_acl.sql", "./seed/*.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
# The app never subscribes to realtime channels. Saves a container.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Local mail catcher (Mailpit). Every email the stack sends — sign-in codes,
# welcome mail from functions — lands at http://127.0.0.1:54324 instead of a real
# inbox. No Gmail / Resend credentials are needed locally.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# The two buckets the app uses (src/auth/AuthProvider.jsx, src/lib/reports.js,
# src/admin/AdminBriefings.jsx). Both public, like live. Created on start/reset.
[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]

[storage.buckets.incident-media]
public = true
file_size_limit = "20MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/avif"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**", "http://localhost:5174/**", "http://localhost:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
# email_sent is IGNORED locally unless [auth.email.smtp] is enabled: the CLI hands
# GoTrue a very high limit for the built-in Mailpit. Kept at the default for clarity.
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# true: sign-up sends a 6-digit code the app verifies (AuthModal → verifyOtp),
# exactly as live does since the OTP switch. Read the code in Mailpit.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Same code template as live (the dashboard templates were pasted from here).
[auth.email.template.magic_link]
subject = "Your Attacked.ai sign-in code"
content_path = "./supabase_email_templates/otp_code.html"

[auth.email.template.confirmation]
subject = "Your Attacked.ai sign-in code"
content_path = "./supabase_email_templates/otp_code.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Social sign-in stays OFF locally: it needs the provider's client id/secret and
# a redirect URL registered with Google. The app hides provider buttons unless
# VITE_AUTH_PROVIDERS is set (src/auth/AuthModal.jsx), so leave that empty in
# .env.docker. To test Google locally: put the two values in supabase/.env
# (git-ignored) and set enabled = true.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = true

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# Edge functions (supabase/functions/*) run locally too, with hot reload. Their
# secrets come from supabase/functions/.env (copy .env.example there).
# To save ~200 MB RAM skip them:  LOCAL_SUPABASE_EXCLUDE=imgproxy,edge-runtime
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Machine-called functions (scheduler / pg_cron / owner scripts) check their own
# shared secret (_shared/auth.ts), not a user JWT — same as their live setting.
[functions.daily-digest]
verify_jwt = false

[functions.welcome-email]
verify_jwt = false

[functions.incident-deliver]
verify_jwt = false

[functions.incident-images]
verify_jwt = false

[functions.incident-report]
verify_jwt = false

[functions.guard-ingest]
verify_jwt = false

[functions.attack-map-feed]
verify_jwt = false

[analytics]
# Logflare + Vector: ~1 GB RAM for logs nobody reads locally. Off.
enabled = false
port = 54327
backend = "postgres"

[experimental]
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[experimental.pgdelta]
enabled = true
