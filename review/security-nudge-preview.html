<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security reminder preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: Inter, sans-serif; }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #0B0B0C; color: #fff; padding: 8px 16px; font: 600 12px Inter, sans-serif; }
  .bar b { color: #FCBD00; }
  iframe { position: fixed; inset: 34px 0 0 0; width: 100%; height: calc(100% - 34px); border: 0; }
</style>
</head>
<body>
<!-- Local review only (served by the Vite dev server; never deployed): the real
     SecurityNudge logic for a simulated signed-in reader, over the real Hub page.
     ?state=off (reminder shows) | on | passkey | down (bridge unavailable)
     &keep=1 keeps the "Remind me later" snooze between reloads. -->
<div class="bar">Security reminder preview · <b>simulated</b> reader and bridge · state: <span id="st"></span> · <span id="info"></span></div>
<iframe src="/?hub" title="Attacked Hub (background)"></iframe>
<div id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { supabase } from "/src/lib/supabaseClient.js";
import { SecurityNudgeFor } from "/src/auth/SecurityNudge.jsx";

const q = new URLSearchParams(location.search);
const state = q.get("state") || "off";
document.getElementById("st").textContent = state;
if (!q.has("keep")) { try { localStorage.removeItem("atk.securityPrompt"); } catch {} }
window.__bridgeCalls = 0;
supabase.auth.getSession = async () => ({ data: { session: { access_token: "preview.token.only" } }, error: null });
const real = window.fetch.bind(window);
window.fetch = async (url, init = {}) => {
  const u = String(url);
  if (!u.includes("/workos-auth/security")) return real(url, init);
  window.__bridgeCalls++;
  await new Promise((r) => setTimeout(r, 250));
  const res = (status, j) => new Response(JSON.stringify(j), { status, headers: { "Content-Type": "application/json" } });
  if (state === "down") return res(404, { error: "not found" });
  return res(200, { workos: true, totp: { on: state === "on" }, method: state === "passkey" ? "Passkey" : "GoogleOAuth", strong: false, recent: true });
};
const info = () => { let s = null; try { s = JSON.parse(localStorage.getItem("atk.securityPrompt") || "null"); } catch {}
  const v = s && s["preview-user"]; document.getElementById("info").textContent = v ? `handled sign-in ${v}` : "not handled yet"; };
info(); window.addEventListener("click", () => setTimeout(info, 50));
createRoot(document.getElementById("root")).render(
  React.createElement(React.StrictMode, null,
    React.createElement(SecurityNudgeFor, { user: { id: "preview-user", email: "reader@example.com", last_sign_in_at: "2026-10-27T10:00:00Z", app_metadata: {} }, loading: false })));
</script>
</body>
</html>
